# SPDX-License-Identifier: Apache-2.0
#
# pages.yml — publishes site/ (a static, no-build-step dashboard) to GitHub
# Pages, together with a copy of the committed results/ JSON it renders.
#
# Why a copy step instead of the site fetching results/ directly: GitHub
# Pages serves whatever is uploaded as the Pages artifact, which is *not*
# the whole repository checkout — only site/ is a page. So this workflow
# copies results/ into the published output at publish time (data/results/)
# and writes a small data/manifest.json index of what's there. This keeps
# the dashboard same-origin only (no cross-origin fetch to raw.githubusercontent
# or similar) and means site/app.js never needs to know exact filenames in
# advance — new *.json files dropped into results/ by future runs show up
# automatically the next time this workflow runs, with zero site/ changes.
#
# Deliberately does NOT run on pull_request (including from forks): Pages
# deploys write to this repository's own github-pages environment and mint
# an id-token, which pull_request_target-style triggers should not be
# handed to untrusted fork code. Only push-to-main and manual dispatch can
# publish.
#
# Must not fail the build if results/ is missing or incomplete (e.g. a
# fresh clone before any measurement has been run) — the dashboard renders
# an honest empty state instead (see site/app.js); see the "Prepare Pages
# content" step below, which never errors on a missing directory.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "results/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare Pages content
        # Assembles _site/ = site/*.{html,css,js} + data/results/** (a copy
        # of the committed results/ directory) + data/manifest.json (an
        # index of the json/png files under results/, grouped by the
        # categories site/app.js understands: dispatch ledgers, bench
        # sweeps, crossover extras, reference figures). Never fails the
        # build if results/ is absent — writes an empty manifest instead.
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/data

          if [ -d results ]; then
            cp -r results _site/data/results
          else
            echo "::warning::results/ not found at publish time -- dashboard will render its empty state"
          fi

          python3 - <<'PY'
          import json
          import os

          ROOT = "_site/data"
          RESULTS = os.path.join(ROOT, "results")

          manifest = {
              "generated_by": "pages.yml",
              "dispatch_ledgers": [],
              "bench": [],
              "crossover": [],
              "figures": [],
              "other_json": [],
          }

          if os.path.isdir(RESULTS):
              for dirpath, _dirnames, filenames in os.walk(RESULTS):
                  rel_dir = os.path.relpath(dirpath, ROOT).replace(os.sep, "/")
                  lower_dir = rel_dir.lower()
                  for fname in filenames:
                      rel = f"{rel_dir}/{fname}" if rel_dir != "." else fname
                      lower = fname.lower()
                      if lower.endswith(".json"):
                          if lower.startswith("dispatch-ledger-"):
                              manifest["dispatch_ledgers"].append(rel)
                          elif lower_dir.endswith("/crossover") or "/crossover/" in lower_dir:
                              manifest["crossover"].append(rel)
                          elif (
                              lower_dir.endswith("/bench")
                              or lower.startswith("bench-")
                              or lower.startswith("kernel-bench-")
                          ):
                              manifest["bench"].append(rel)
                          else:
                              manifest["other_json"].append(rel)
                      elif lower.endswith((".png", ".jpg", ".jpeg", ".svg")) and "figures" in lower_dir:
                          manifest["figures"].append(rel)

          for key in ("dispatch_ledgers", "bench", "crossover", "figures", "other_json"):
              manifest[key].sort()

          os.makedirs(ROOT, exist_ok=True)
          with open(os.path.join(ROOT, "manifest.json"), "w") as fh:
              json.dump(manifest, fh, indent=2)

          print(json.dumps(manifest, indent=2))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
